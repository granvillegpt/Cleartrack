    <!-- IMMEDIATE blocking script - runs before ANY other content -->
    <script>
        (function() {
            'use strict';
            // Store observer reference globally so it can be disconnected
            window.hideBodyContentObserver = null;
            let isContentShown = false;
            
            // Hide all body content except loading overlay
            function hideBodyContent() {
                // Don't hide if content has been explicitly shown
                if (isContentShown) {
                    return;
                }
                
                if (document.body) {
                    // Hide all children except loading overlay
                    var children = document.body.children;
                    for (var i = 0; i < children.length; i++) {
                        if (children[i].id !== 'loadingOverlay') {
                            children[i].style.display = 'none';
                            children[i].style.visibility = 'hidden';
                            children[i].style.opacity = '0';
                        }
                    }
                    // Ensure loading overlay is visible
                    var overlay = document.getElementById('loadingOverlay');
                    if (overlay) {
                        overlay.style.display = 'flex';
                        overlay.style.visibility = 'visible';
                        overlay.style.opacity = '1';
                        overlay.style.position = 'fixed';
                        overlay.style.zIndex = '999999';
                    }
                }
            }
            
            // Run immediately
            hideBodyContent();
            
            // Intercept body creation and new content
            window.hideBodyContentObserver = new MutationObserver(function(mutations) {
                if (document.body && !isContentShown) {
                    hideBodyContent();
                }
            });
            
            if (document.documentElement) {
                window.hideBodyContentObserver.observe(document.documentElement, { childList: true, subtree: true });
            }
            
            // Also run on DOMContentLoaded
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    if (!isContentShown) {
                        hideBodyContent();
                    }
                });
            } else {
                if (!isContentShown) {
                    hideBodyContent();
                }
            }
            
            // Expose function to stop hiding
            window.stopHidingBodyContent = function() {
                isContentShown = true;
                // #region agent log
                fetch('http://127.0.0.1:7243/ingest/4ced639f-f705-4ba5-816f-e4d083213529',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'client-onboarding.html:108',message:'stopHidingBodyContent executed',data:{isContentShown,observerExists:!!window.hideBodyContentObserver},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'A'})}).catch(()=>{});
                // #endregion
                if (window.hideBodyContentObserver) {
                    window.hideBodyContentObserver.disconnect();
                    window.hideBodyContentObserver = null;
                }
            };
        })();
    </script>

            if (window.stopHidingBodyContent) {

                fetch('http://127.0.0.1:7243/ingest/4ced639f-f705-4ba5-816f-e4d083213529',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'client-onboarding.html:277',message:'stopHidingBodyContent called',data:{observerStillExists:!!window.hideBodyContentObserver},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'A'})}).catch(()=>{});
                // #endregion
            }
            
            // Disconnect observer if it exists
            if (window.hideBodyContentObserver) {
                window.hideBodyContentObserver.disconnect();
                window.hideBodyContentObserver = null;
                // #region agent log
                fetch('http://127.0.0.1:7243/ingest/4ced639f-f705-4ba5-816f-e4d083213529',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'client-onboarding.html:283',message:'Observer disconnected',data:{observerDisconnected:true},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'A'})}).catch(()=>{});

            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.style.display = 'none';
                overlay.style.visibility = 'hidden';
                overlay.style.opacity = '0';
            }
            
            // Also use loading-screen.js hide function if available
            if (window.hideLoadingScreen) {
                window.hideLoadingScreen();
            }
            
            // Remove the CSS rule that hides content
            const styleSheet = document.styleSheets[0];
            let cssRuleRemoved = false;
            if (styleSheet) {
                try {
                    const rules = styleSheet.cssRules || styleSheet.rules;
                    for (let i = 0; i < rules.length; i++) {
                        if (rules[i].selectorText === 'body > *:not(#loadingOverlay)') {
                            styleSheet.deleteRule(i);
                            cssRuleRemoved = true;
                            console.log('[onboarding] ✅ Removed CSS rule hiding body content');
                            break;
                        }
                    }
                } catch (e) {

            }
            
            // #region agent log

            // Show all body content (remove hiding from children with !important override)
            let visibleChildrenCount = 0;
            if (document.body) {
                var children = document.body.children;
                for (var i = 0; i < children.length; i++) {
                    if (children[i].id !== 'loadingOverlay') {
                        children[i].style.setProperty('display', 'block', 'important');
                        children[i].style.setProperty('visibility', 'visible', 'important');
                        children[i].style.setProperty('opacity', '1', 'important');
                        visibleChildrenCount++;
                    }
                }
                console.log('[onboarding] ✅ Made', children.length, 'body children visible');
            }
            
            // Also ensure body itself is visible
            if (document.body) {
                document.body.style.setProperty('visibility', 'visible', 'important');
                document.body.style.setProperty('opacity', '1', 'important');
            }
            
            // #region agent log
            fetch('http://127.0.0.1:7243/ingest/4ced639f-f705-4ba5-816f-e4d083213529',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'client-onboarding.html:333',message:'Content visibility set',data:{visibleChildrenCount,bodyVisibility:document.body?.style.visibility,bodyOpacity:document.body?.style.opacity,firstChildDisplay:document.body?.children[0]?.style.display,firstChildVisibility:document.body?.children[0]?.style.visibility},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'A'})}).catch(()=>{});
            // #endregion
            
            console.log('[onboarding] ✅ Onboarding content should now be visible');
        };

        (function() {

            setTimeout(function() {

                }
            }, 2500);

            setupOnboardingHandlers();
        });
        
        // Helper function to ensure user profile exists (creates if missing)
        // Make it globally accessible for head scripts
        window.ensureUserProfileExists = async function ensureUserProfileExists(uid, email) {
            if (!window.firebaseDb) {
                console.error('[onboarding] Firestore not available');
                return null;
            }
            
            try {
                const userRef = window.firebaseDb.collection('users').doc(uid);
                const userDoc = await userRef.get();
                
                if (userDoc.exists) {
                    console.log('[onboarding] User profile already exists');
                    return userDoc.data();
                }
                
                // Profile doesn't exist - create it with minimal defaults
                console.log('[onboarding] Creating new user profile for:', uid);
                const defaultProfile = {
                    uid: uid,
                    email: email || null,
                    role: 'client',
                    onboardingStep: 1,
                    createdAt: window.firebaseDb.FieldValue && window.firebaseDb.FieldValue.serverTimestamp ? 
                        window.firebaseDb.FieldValue.serverTimestamp() : 
                        new Date().toISOString()
                };
                
                await userRef.set(defaultProfile);
                console.log('[onboarding] ✅ User profile created successfully');
                return defaultProfile;
            } catch (error) {
                console.error('[onboarding] ❌ Error ensuring user profile:', error);
                // Return null on error - let the flow continue with error handling
                return null;
            }
        }
        
        // Background auth check - only redirects if absolutely necessary
        async function checkAuthStatusBackground() {
            console.log('[onboarding] 🔍 checkAuthStatusBackground() called');
            try {
                if (!window.firebaseAuth) {
                    console.log('[onboarding] ⚠️ Firebase not ready - page will work without auth check');
                    return;
                }
                
                // Check if user is logged in
                const currentUser = window.firebaseAuth.currentUser;
                console.log('[onboarding] 🔍 Current user:', currentUser ? currentUser.uid : 'NOT LOGGED IN');
                
                if (!currentUser) {
                    // Not logged in - but don't redirect immediately
                    // Let them see the page, they'll be redirected when they try to submit
                    console.log('[onboarding] ⚠️ User not logged in - will redirect on form submission');
                    return;
                }
                
                // User is logged in - check role FIRST
                if (!window.firebaseDb) {
                    console.log('[onboarding] ⚠️ Firestore not ready');
                    return;
                }
                
                console.log('[onboarding] 🔍 Fetching user document for UID:', currentUser.uid);
                let userDoc = await window.firebaseDb.collection('users').doc(currentUser.uid).get();
                console.log('[onboarding] 🔍 User document exists:', userDoc.exists);
                
                if (!userDoc.exists) {
                    console.log('[onboarding] ⚠️ User document does not exist - creating profile');
                    const profile = await ensureUserProfileExists(currentUser.uid, currentUser.email);
                    if (!profile) {
                        // Error creating profile - show error message but still show onboarding
                        console.error('[onboarding] Failed to create profile, showing onboarding anyway');
                        const loadingText = document.getElementById('loadingText');
                        if (loadingText) {
                            loadingText.textContent = 'Setting up your account...';
                        }
                        if (window.showOnboardingContent) {
                            window.showOnboardingContent();
                        }
                        return;
                    }
                    // Profile created - re-fetch to get the created document
                    userDoc = await window.firebaseDb.collection('users').doc(currentUser.uid).get();
                    console.log('[onboarding] ✅ Profile created, re-fetched document');
                }
                
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    console.log('[onboarding] 🔍 User data:', JSON.stringify(userData, null, 2));

                    console.log('[onboarding] 🔍 Practitioner ID:', practitionerId);
                    
                    if (practitionerId) {

        function setupPractitionerIdListener(uid) {
            if (!window.firebaseDb) return;
            
            const userRef = window.firebaseDb.collection('users').doc(uid);

                    // Check auth before submitting
                    if (!window.firebaseAuth || !window.firebaseAuth.currentUser) {
                        questionnaireFeedback.innerHTML = '<div class="alert alert-error">Please log in first. Redirecting to login page...</div>';
                        setTimeout(() => {
                            window.location.href = '/login.html';
                        }, 2000);
                        return;
                    }
                    
                    questionnaireFeedback.innerHTML = '';
                    
                    if (!window.CTClientLinking) {
                        questionnaireFeedback.innerHTML = '<div class="alert alert-error">Client linking module not loaded</div>';
                        return;
                    }
                    
                    const needCheckboxes = document.querySelectorAll('#onboarding-questionnaire-section input[type="checkbox"][data-need-tag]');
                    const needs = Array.from(needCheckboxes)
                        .filter(cb => cb.checked)
                        .map(cb => cb.getAttribute('data-need-tag'))
                        .filter(tag => tag); // Filter out any null/empty values
                    
                    if (needs.length === 0) {
                        questionnaireFeedback.innerHTML = '<div class="alert alert-error">Please select at least one option</div>';
                        return;
                    }
                    
                    const message = questionnaireMessage ? questionnaireMessage.value.trim() : '';
                    
                    try {
                        questionnaireBtn.disabled = true;
                        questionnaireBtn.textContent = 'Sending...';
                        
                        await window.CTClientLinking.createClientRequest(needs, message);
                        
                        questionnaireFeedback.innerHTML = '<div class="alert alert-success">Request sent successfully! A practitioner will review and accept your request. You will be redirected to your dashboard once connected.</div>';
                        questionnaireBtn.disabled = false;
                        questionnaireBtn.textContent = 'Send Request';
                        
                        // Optionally redirect after a delay, or wait for practitioner to accept
                        // For now, we'll let them know to wait
                    } catch (err) {
                        questionnaireFeedback.innerHTML = `<div class="alert alert-error">${err.message || 'Could not send request. Please try again.'}</div>`;
                        questionnaireBtn.disabled = false;
                        questionnaireBtn.textContent = 'Send Request';
                    }
                });
            }
        }

        // Style 6: Compact Dropdown Menu Toggle - Clean Implementation
        (function() {
            // Ensure nav is visible on desktop immediately
            function ensureNavVisibility() {
                const mainNav = document.getElementById("mainNav");
                const logoutLink = document.getElementById("logoutLink");
                
                if (mainNav && window.innerWidth >= 769) {
                    // Desktop: force nav to be visible
                    mainNav.style.cssText = 'display: flex !important; position: static !important; background: transparent !important; visibility: visible !important; opacity: 1 !important; max-height: none !important;';
                    console.log('[onboarding] Desktop nav forced visible');
                }
                
                if (logoutLink) {
                    logoutLink.style.cssText = 'display: block !important; visibility: visible !important; opacity: 1 !important; color: #e0fbff !important;';
                    console.log('[onboarding] Logout link forced visible');
                }
            }
            
            // Run immediately and on load/resize
            ensureNavVisibility();
            window.addEventListener('load', ensureNavVisibility);
            window.addEventListener('resize', ensureNavVisibility);
            
            const menuToggle = document.getElementById("menuToggle");
            const mainNav = document.getElementById("mainNav");

            if (menuToggle && mainNav) {
                function toggleMenu() {
                    mainNav.classList.toggle('active');
                    menuToggle.classList.toggle('active');
                }

                menuToggle.addEventListener("click", function(e) {
                    e.stopPropagation();
                    toggleMenu();
                });

                // Close menu when clicking on a link
                const navLinks = mainNav.querySelectorAll("a");
                navLinks.forEach(function(link) {
                    link.addEventListener("click", function() {
                        mainNav.classList.remove('active');
                        menuToggle.classList.remove('active');
                    });
                });

                // Close menu when clicking outside (Style 6 dropdown)
                document.addEventListener('click', function(event) {
                    const header = document.querySelector("header");
                    if (mainNav.classList.contains('active')) {
                        if (header && !header.contains(event.target)) {
                            mainNav.classList.remove('active');
                            menuToggle.classList.remove('active');
                        }
                    }
                });
            } else {
                console.warn('[onboarding] Menu toggle or nav not found');
            }

            // Logout handler function
            async function handleLogout(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                
                console.log('[onboarding] Logout button clicked');
                
                // Show loading screen
                if (window.showLoadingScreen) {
                    window.showLoadingScreen('Signing out...', 'Logging out of ClearTrack');
                }
                
                try {
                    // Check if Firebase Auth is available
                    if (window.firebaseAuth) {
                        await window.firebaseAuth.signOut();
                    }
                    
                    // Clear any local storage
                    localStorage.removeItem('token');
                    localStorage.removeItem('firebaseUser');
                    
                    // Small delay to show loading message
                    await new Promise(resolve => setTimeout(resolve, 300));
                    
                    // Redirect to index page
                    window.location.href = '/index.html';
                } catch (error) {
                    console.error('Logout error:', error);
                    if (window.hideLoadingScreen) window.hideLoadingScreen();
                    // Still redirect even if logout fails
                    window.location.href = '/index.html';
                }
            }
            
            // Logout handler for header link
            const logoutLink = document.getElementById("logoutLink");
            if (logoutLink) {
                logoutLink.addEventListener("click", handleLogout);
            }
            
            // Logout handler for bottom nav button
            const bottomNavLogout = document.getElementById("bottomNavLogout");
            const bottomNav = document.getElementById("bottomNav");
            
            function updateBottomNavVisibility() {
                if (bottomNav) {
                    const isMobile = window.innerWidth <= 768;
                    console.log('[onboarding] Window width:', window.innerWidth, 'isMobile:', isMobile);
                    
                    if (isMobile) {
                        // Mobile: show bottom nav
                        bottomNav.style.cssText = 'display: flex !important; position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; z-index: 10000 !important; visibility: visible !important; opacity: 1 !important;';
                        console.log('[onboarding] Bottom nav shown on mobile');
                    } else {
                        // Desktop: hide bottom nav
                        bottomNav.style.cssText = 'display: none !important; visibility: hidden !important; opacity: 0 !important;';
                        console.log('[onboarding] Bottom nav hidden on desktop');
                    }
                } else {
                    console.warn('[onboarding] Bottom nav element not found');
                }
            }
            
            // Function to ensure bottom nav is visible on mobile
            function ensureBottomNavVisible() {
                const nav = document.getElementById("bottomNav");
                if (nav) {
                    const isMobile = window.innerWidth <= 768 || window.matchMedia('(max-width: 768px)').matches;
                    console.log('[onboarding] Ensuring bottom nav visibility. Width:', window.innerWidth, 'isMobile:', isMobile);
                    
                    if (isMobile) {
                        nav.style.setProperty('display', 'flex', 'important');
                        nav.style.setProperty('position', 'fixed', 'important');
                        nav.style.setProperty('bottom', '0', 'important');
                        nav.style.setProperty('left', '0', 'important');
                        nav.style.setProperty('right', '0', 'important');
                        nav.style.setProperty('z-index', '10000', 'important');
                        nav.style.setProperty('visibility', 'visible', 'important');
                        nav.style.setProperty('opacity', '1', 'important');
                        console.log('[onboarding] Bottom nav forced to display on mobile');
                    } else {
                        nav.style.setProperty('display', 'none', 'important');
                        console.log('[onboarding] Bottom nav hidden on desktop');
                    }
                } else {
                    console.error('[onboarding] Bottom nav element NOT found');
                }
            }
            
            if (bottomNav) {
                console.log('[onboarding] Bottom nav element found');
                // Set initial visibility multiple times to ensure it works
                ensureBottomNavVisible();
                setTimeout(ensureBottomNavVisible, 50);
                setTimeout(ensureBottomNavVisible, 200);
                setTimeout(ensureBottomNavVisible, 500);
            } else {
                console.error('[onboarding] Bottom nav element NOT found in DOM');
            }
            
            if (bottomNavLogout) {
                console.log('[onboarding] Bottom nav logout button found');
                bottomNavLogout.addEventListener("click", handleLogout);
            } else {
                console.warn('[onboarding] Bottom nav logout button NOT found');
            }
            
            // Update visibility on window resize and load
            window.addEventListener('resize', ensureBottomNavVisible);
            window.addEventListener('load', ensureBottomNavVisible);
            
            // Also use matchMedia for more reliable detection
            const mediaQuery = window.matchMedia('(max-width: 768px)');
            mediaQuery.addEventListener('change', ensureBottomNavVisible);
        })();
    </script>
</body>
