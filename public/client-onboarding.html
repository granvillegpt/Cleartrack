    <!-- CRITICAL: Hide body content IMMEDIATELY - but keep loading screen visible -->
    <style>
        html { 
            background: #f5f7fa !important;
            /* Match loading screen background to prevent white flash */
            background-image: url('/splash/Splash Screen cleartrack.png');
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
        }
        @media (min-width: 768px) {
            html {
                background-image: url('/splash/Splash Screen Travel App Mobile Prototypes (1920 x 1080 px).png');
                background-position: center 25%;
            }
        }
        body { 
            /* Don't hide body completely - we need loading screen visible */
            /* Instead, hide all children except loading overlay */
            overflow: hidden !important;
        }
        /* Hide all body content EXCEPT the loading overlay */
        body > *:not(#loadingOverlay) {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
        /* Ensure loading overlay is always visible and on top */
        #loadingOverlay {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: fixed !important;
            z-index: 999999 !important;
        }
    </style>
    
    <!-- IMMEDIATE blocking script - runs before ANY other content -->
    <script>
        (function() {
            'use strict';
            // Hide all body content except loading overlay
            function hideBodyContent() {
                if (document.body) {
                    // Hide all children except loading overlay and scripts
                    var children = document.body.children;
                    for (var i = 0; i < children.length; i++) {
                        const child = children[i];
                        // Skip loading overlay and script tags (scripts should never be visible)
                        if (child.id !== 'loadingOverlay' && child.tagName !== 'SCRIPT') {
                            child.style.display = 'none';
                            child.style.visibility = 'hidden';
                            child.style.opacity = '0';
                        } else if (child.tagName === 'SCRIPT') {
                            // Ensure scripts are always hidden
                            child.style.display = 'none';
                            child.style.visibility = 'hidden';
                        }
                    }
                    // Ensure loading overlay is visible
                    var overlay = document.getElementById('loadingOverlay');
                    if (overlay) {
                        overlay.style.display = 'flex';
                        overlay.style.visibility = 'visible';
                        overlay.style.opacity = '1';
                        overlay.style.position = 'fixed';
                        overlay.style.zIndex = '999999';
                    }
                }
            }
            
            // Run immediately
            hideBodyContent();
            
            // Intercept body creation and new content
            var observer = new MutationObserver(function(mutations) {
                // Only hide content if it hasn't been shown yet
                if (document.body && !window._onboardingContentShown) {
                    hideBodyContent();
                }
            });
            
            // Store observer reference so it can be disconnected
            window._onboardingMutationObserver = observer;
            
            if (document.documentElement) {
                observer.observe(document.documentElement, { childList: true, subtree: true });
            }
            
            // Also run on DOMContentLoaded
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', hideBodyContent);
            } else {
                hideBodyContent();
            }
        })();
    </script>
    <!-- SIMPLIFIED REDIRECT - Single check, no polling loops -->
    <script>
        (function() {
            console.log('[HEAD] Redirect check initialized');
            
            // Global flag to prevent multiple redirect checks
            if (window._redirectCheckDone) {
                return; // Already checked
            }
            
            async function checkAndRedirect() {
                // Prevent multiple simultaneous checks
                if (window._redirectChecking || window._redirectCheckDone) {
                    return false;
                }
                window._redirectChecking = true;
                
                if (!window.firebaseAuth || !window.firebaseDb) {
                    window._redirectChecking = false;
                    return false;
                }
                
                const user = window.firebaseAuth.currentUser;
                if (!user || !user.email) {
                    window._redirectChecking = false;
                    return false;
                }
                
                console.log('[HEAD] Checking user role:', user.email);
                
                try {
                    // Check by UID FIRST (faster, direct lookup)
                    const uidDoc = await window.firebaseDb.collection('users').doc(user.uid).get();
                    if (uidDoc.exists) {
                        const role = String(uidDoc.data().role || '').toLowerCase().trim();
                        if (role === 'practitioner') {
                            console.log('[HEAD] ✅ Redirecting practitioner');
                            window._redirectCheckDone = true;
                            window.location.replace('/practitioner-dashboard.html?v=' + Date.now());
                            return true;
                        } else if (role === 'admin') {
                            console.log('[HEAD] ✅ Redirecting admin');
                            window._redirectCheckDone = true;
                            window.location.replace('/admin-dashboard.html?v=' + Date.now());
                            return true;
                        }
                    }
                    
                    // Regular user - show content ONLY after confirming NOT a practitioner
                    console.log('[HEAD] ✅ User is regular - showing onboarding');
                    window._redirectCheckDone = true;
                    // Small delay to ensure redirect doesn't happen after this
                    setTimeout(() => {
                        // Double-check we're still on onboarding page
                        if (window.location.pathname.includes('client-onboarding.html')) {
                            if (window.showOnboardingContent) {
                                window.showOnboardingContent();
                            }
                        }
                    }, 100);
                    return false;
                } catch (e) {
                    console.error('[HEAD] Error:', e);
                    window._redirectCheckDone = true;
                    // On error, only show content if we have a user (might be regular user)
                    if (window.firebaseAuth && window.firebaseAuth.currentUser) {
                        if (window.showOnboardingContent) {
                            window.showOnboardingContent();
                        }
                    }
                    return false;
                } finally {
                    window._redirectChecking = false;
                }
            }
            
            // BLOCKING CHECK: Prevent ANY content from showing until redirect is confirmed
            // This ensures practitioners NEVER see the onboarding page
            let redirectChecked = false;
            let isPractitioner = false;
            let authStateKnown = false;
            
            async function blockingRedirectCheck() {
                if (redirectChecked) return;
                
                // Wait for Firebase to be ready
                if (!window.firebaseAuth || !window.firebaseDb) {
                    setTimeout(blockingRedirectCheck, 50);
                    return;
                }
                
                const user = window.firebaseAuth.currentUser;
                if (!user) {
                    // CRITICAL: Wait for auth state to be known - don't show content until we have a user
                    if (!authStateKnown) {
                        // Set up auth state listener if not already set up
                        if (window.firebaseAuth && !window._authListenerSet) {
                            window._authListenerSet = true;
                            window.firebaseAuth.onAuthStateChanged((authUser) => {
                                authStateKnown = true;
                                if (authUser) {
                                    console.log('[HEAD] 🔐 Auth state known - user detected, running blocking check');
                                    blockingRedirectCheck();
                                } else {
                                    // No user - wait a bit more for auth to initialize
                                    setTimeout(() => {
                                        if (!window.firebaseAuth.currentUser) {
                                            console.log('[HEAD] ⚠️ No user after waiting - allowing content (will redirect if practitioner detected)');
                                            redirectChecked = true;
                                            window._redirectCheckDone = true;
                                        }
                                    }, 2000);
                                }
                            });
                        }
                        setTimeout(blockingRedirectCheck, 50);
                        return;
                    } else {
                        // Auth state known but no user - allow content (will be checked by other scripts)
                        redirectChecked = true;
                        window._redirectCheckDone = true;
                        return;
                    }
                }
                
                authStateKnown = true;
                redirectChecked = true;
                
                try {
                    // CRITICAL: Check role immediately
                    const uidDoc = await window.firebaseDb.collection('users').doc(user.uid).get();
                    if (uidDoc.exists) {
                        const role = String(uidDoc.data().role || '').toLowerCase().trim();
                        if (role === 'practitioner') {
                            console.log('[HEAD] 🚨 PRACTITIONER DETECTED - BLOCKING CONTENT, REDIRECTING NOW');
                            isPractitioner = true;
                            window._redirectCheckDone = true;
                            // Use replace to prevent back button
                            window.location.replace('/practitioner-dashboard.html?v=' + Date.now());
                            return;
                        } else if (role === 'admin') {
                            console.log('[HEAD] 🚨 ADMIN DETECTED - BLOCKING CONTENT, REDIRECTING NOW');
                            isPractitioner = true;
                            window._redirectCheckDone = true;
                            window.location.replace('/admin-dashboard.html?v=' + Date.now());
                            return;
                        }
                    }
                    
                    // Regular user - allow content to show
                    console.log('[HEAD] ✅ Regular user confirmed - allowing content');
                    window._redirectCheckDone = true;
                } catch (e) {
                    console.error('[HEAD] Error in blocking check:', e);
                    // On error, assume regular user
                    window._redirectCheckDone = true;
                }
            }
            
            // Start blocking check IMMEDIATELY
            blockingRedirectCheck();
            
            // Also listen for auth state changes - PRIMARY METHOD
            if (window.firebaseAuth) {
                window.firebaseAuth.onAuthStateChanged((user) => {
                    authStateKnown = true;
                    if (user && !redirectChecked && window.firebaseDb) {
                        console.log('[HEAD] 🔐 Auth state changed - user detected, running blocking check');
                        blockingRedirectCheck();
                    }
                });
            }
            
            // Listen for Firebase ready event
            if (window.addEventListener) {
                window.addEventListener('firebaseReady', () => {
                    if (!redirectChecked) {
                        blockingRedirectCheck();
                    }
                });
            }
            
            // Fallback: Also run the original check function
            function runCheck() {
                if (window._redirectCheckDone || isPractitioner) return;
                if (window.firebaseAuth && window.firebaseDb) {
                    checkAndRedirect();
                } else {
                    setTimeout(runCheck, 50);
                }
            }
            runCheck();
        })();
    </script>

    <!-- Loading screen is already hardcoded in HTML above for immediate display -->
    <script src="loading-screen.js"></script>
    <script>
        // Loading screen is already visible (hardcoded in HTML)
        // Just ensure it stays visible and update text if needed
        (function() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                // Ensure it's visible
                overlay.style.display = 'flex';
                overlay.style.visibility = 'visible';
                overlay.style.opacity = '1';
            }
        })();
        
        // Global function to show page content (called when redirect check confirms user is a client)
        let contentShown = false; // Flag to prevent multiple calls
        let mutationObserver = null; // Store observer to disconnect it
        
        // Store the mutation observer reference from the blocking script
        window._onboardingMutationObserver = null;
        
        window.showOnboardingContent = function() {
            // CRITICAL: Never show content until we have a user AND confirmed they're NOT a practitioner
            if (!window.firebaseAuth) {
                console.log('[onboarding] 🚨 BLOCKED: Firebase Auth not ready');
                setTimeout(() => {
                    if (window.showOnboardingContent) {
                        window.showOnboardingContent();
                    }
                }, 200);
                return;
            }
            
            const user = window.firebaseAuth.currentUser;
            if (!user) {
                console.log('[onboarding] 🚨 BLOCKED: No user - waiting for auth state');
                // Set up auth listener if not already done
                if (!window._showContentAuthListenerSet) {
                    window._showContentAuthListenerSet = true;
                    window.firebaseAuth.onAuthStateChanged((authUser) => {
                        if (authUser && window.showOnboardingContent) {
                            console.log('[onboarding] 🔐 Auth state known - user detected, checking if can show content');
                            setTimeout(() => {
                                if (window.showOnboardingContent) {
                                    window.showOnboardingContent();
                                }
                            }, 100);
                        }
                    });
                }
                return;
            }
            
            // CRITICAL: Never show content if redirect check hasn't completed
            if (window._redirectCheckDone === false || window._redirectCheckDone === undefined) {
                console.log('[onboarding] 🚨 BLOCKED: Redirect check not complete yet');
                // Wait a bit and try again
                setTimeout(() => {
                    if (window._redirectCheckDone && window.showOnboardingContent) {
                        window.showOnboardingContent();
                    }
                }, 200);
                return;
            }
            
            // Double-check we're still on onboarding page (redirect might have happened)
            if (!window.location.pathname.includes('client-onboarding.html')) {
                console.log('[onboarding] 🚨 BLOCKED: Already redirected away');
                return;
            }
            
            if (contentShown) {
                console.log('[onboarding] ⚠️ Content already shown, skipping');
                return;
            }
            contentShown = true;
            window._onboardingContentShown = true; // Set global flag
            
            // Clear safety net timeout since content is now shown
            if (window._onboardingSafetyNetTimeout) {
                clearTimeout(window._onboardingSafetyNetTimeout);
                window._onboardingSafetyNetTimeout = null;
            }
            
            console.log('[onboarding] ✅✅✅ SHOWING ONBOARDING CONTENT NOW');
            
            // Hide loading screen
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.style.display = 'none';
                overlay.style.visibility = 'hidden';
                overlay.style.opacity = '0';
            }
            
            // Also use loading-screen.js hide function if available
            if (window.hideLoadingScreen) {
                window.hideLoadingScreen();
            }
            
            // Show all body content (remove hiding from children)
            if (document.body) {
                var children = document.body.children;
                for (var i = 0; i < children.length; i++) {
                    if (children[i].id !== 'loadingOverlay') {
                        children[i].style.display = '';
                        children[i].style.visibility = 'visible';
                        children[i].style.opacity = '1';
                    }
                }
            }
            }
            
            // Explicitly ensure header is visible
            const header = document.querySelector('.header');
            if (header) {
                header.style.cssText = 'display: block !important; visibility: visible !important; opacity: 1 !important; z-index: 10000 !important; position: sticky !important; top: 0 !important; background: #0b7285 !important;';
            }
            
            const headerTop = document.querySelector('.header-top');
            if (headerTop) {
                // Don't override CSS - let stylesheet handle it
                headerTop.style.visibility = 'visible';
                headerTop.style.opacity = '1';
            }
            
            // Remove CSS rules from stylesheets
            try {
                const styleSheets = document.styleSheets;
                for (let i = 0; i < styleSheets.length; i++) {
                    try {
                        const rules = styleSheets[i].cssRules || styleSheets[i].rules;
                        for (let j = rules.length - 1; j >= 0; j--) {
                            const rule = rules[j];
                            if (rule.selectorText) {
                                if (rule.selectorText.includes('body > *:not(#loadingOverlay)') || 
                                    rule.selectorText === '#loadingOverlay' ||
                                    (rule.selectorText === 'script' && rule.style && rule.style.display === 'none')) {
                                    styleSheets[i].deleteRule(j);
                                }
                            }
                        }
                    } catch (e) {
                        // Cross-origin stylesheet, skip
                    }
                }
            } catch (e) {
                console.warn('[onboarding] Error removing CSS rules:', e);
            }
        };
        
        // Keep body hidden until redirect check completes
        (function() {
            // Body is already hidden via inline style above
            // This ensures it stays hidden during redirect checks
            
            // Safety net: Show content after 5 seconds if no redirect happened AND user is confirmed regular
            // BUT ONLY if we have a user and confirmed they're NOT a practitioner
            setTimeout(function() {
                if (window.location.pathname.includes('client-onboarding.html') && 
                    window._redirectCheckDone && 
                    window.firebaseAuth && 
                    window.firebaseAuth.currentUser) {
                    // Double-check user is not practitioner before showing
                    if (window.showOnboardingContent) {
                        window.showOnboardingContent();
                    }
                }
            }, 5000);
        })();
    </script>
    
    <!-- CRITICAL: Role check - MUST execute immediately -->
    <script>
        console.log('[onboarding] ⚡⚡⚡ HEAD SCRIPT EXECUTING ⚡⚡⚡');
        
        async function redirectIfPractitioner() {
            console.log('[onboarding] 🔍 redirectIfPractitioner() called');
            
            if (!window.firebaseAuth || !window.firebaseDb) {
                console.log('[onboarding] ⏳ Firebase not ready');
                return;
            }
            
            const user = window.firebaseAuth.currentUser;
            if (!user) {
                console.log('[onboarding] ⚠️ No user');
                return;
            }
            
            console.log('[onboarding] ✅ User found:', user.uid);
            
            try {
                const doc = await window.firebaseDb.collection('users').doc(user.uid).get();
                console.log('[onboarding] 🔍 Doc exists:', doc.exists);
                
                if (doc.exists) {
                    const role = String(doc.data().role || 'user').toLowerCase().trim();
                    console.log('[onboarding] 🔍 Role:', role);
                    
                    if (role === 'practitioner') {
                        console.log('[onboarding] ✅✅✅ REDIRECTING PRACTITIONER NOW');
                        window.location.replace('/practitioner-dashboard.html');
                        return;
                    }
                    if (role === 'admin') {
                        console.log('[onboarding] ✅✅✅ REDIRECTING ADMIN NOW');
                        window.location.replace('/admin-dashboard.html');
                        return;
                    }
                }
            } catch (err) {
                console.error('[onboarding] Error:', err);
            }
        }
        
        // Run when Firebase is ready
        function initCheck() {
            if (window.firebaseAuth && window.firebaseDb) {
                console.log('[onboarding] ✅ Firebase ready - checking role');
                redirectIfPractitioner();
            } else {
                setTimeout(initCheck, 200);
            }
        }
        
        initCheck();
        
        // Also listen for Firebase ready event
        window.addEventListener('firebaseReady', () => {
            console.log('[onboarding] 🔔 firebaseReady event');
            redirectIfPractitioner();
        });
        
        // Set callback
        window.onFirebaseReady = function() {
            console.log('[onboarding] 🔔 onFirebaseReady callback');
            redirectIfPractitioner();
        };
        
        // Check on auth state change
        if (window.firebaseAuth) {
            window.firebaseAuth.onAuthStateChanged((user) => {
                if (user) {
                    console.log('[onboarding] 🔍 Auth changed - user:', user.uid);
                    setTimeout(redirectIfPractitioner, 500);
                }
            });
        }
    </script>

                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Logout
        </button>
    </nav>

    <!-- Firebase SDKs (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>

    <!-- My Firebase wiring -->
    <script src="firebase-config.js"></script>
    <script src="firebase-init.js"></script>
    <script src="firebase-api.js"></script>
    <script src="js/client-linking.js"></script>
    <!-- Loading Screen Utility -->
    <script src="loading-screen.js"></script>
    <!-- Diagnostic tool -->
    <script src="diagnose-user.js"></script>
    <!-- Note: dashboard-auth.js is NOT included here to avoid conflicts -->
    
    <script>
        // CRITICAL: This runs AFTER Firebase loads - check role immediately
        console.log('[onboarding] 🔥 BODY SCRIPT LOADED - Firebase should be ready');
        
        // Call the immediate check function if it exists - run multiple times
        if (window.checkPractitionerRole) {
            console.log('[onboarding] Calling immediate check function');
            window.checkPractitionerRole(); // Run immediately
            setTimeout(() => window.checkPractitionerRole(), 500);
            setTimeout(() => window.checkPractitionerRole(), 1000);
            setTimeout(() => window.checkPractitionerRole(), 2000);
            setTimeout(() => window.checkPractitionerRole(), 3000);
        }
        
        // Also set up a listener for when Firebase is ready
        const checkWhenReady = setInterval(() => {
            if (window.firebaseAuth && window.firebaseDb && window.checkPractitionerRole) {
                window.checkPractitionerRole();
            }
        }, 500);
        setTimeout(() => clearInterval(checkWhenReady), 10000);
        
        (function checkRoleAfterFirebase() {
            console.log('[onboarding] 🔥 checkRoleAfterFirebase() executing');
            
            if (!window.firebaseAuth || !window.firebaseDb) {
                console.log('[onboarding] ⏳ Firebase not ready in body script');
                setTimeout(checkRoleAfterFirebase, 300);
                return;
            }
            
            const user = window.firebaseAuth.currentUser;
            if (!user) {
                console.log('[onboarding] ⚠️ No user in body script');
                return;
            }
            
            console.log('[onboarding] ✅✅✅ USER FOUND IN BODY SCRIPT:', user.uid, user.email);
            
            window.firebaseDb.collection('users').doc(user.uid).get()
                .then(doc => {
                    console.log('[onboarding] 🔍 Body script - Doc exists:', doc.exists);
                    if (doc.exists) {
                        const role = String(doc.data().role || 'user').toLowerCase().trim();
                        console.log('[onboarding] 🔍 Body script - Role:', role);
                        
                        if (role === 'practitioner') {
                            console.log('[onboarding] ✅✅✅ BODY SCRIPT - REDIRECTING PRACTITIONER');
                            window.location.replace('/practitioner-dashboard.html');
                        } else if (role === 'admin') {
                            console.log('[onboarding] ✅✅✅ BODY SCRIPT - REDIRECTING ADMIN');
                            window.location.replace('/admin-dashboard.html');
                        }
                    }
                })
                .catch(err => console.error('[onboarding] Body script error:', err));
        })();
        
        // Also run the old script
        (function() {
            console.log('[onboarding] ⚡⚡⚡ SCRIPT BLOCK EXECUTING NOW ⚡⚡⚡');
            
            async function redirectPractitioners() {
                // Skip if already checked or content shown
                if (window._redirectCheckDone || window._onboardingContentShown) {
                    return;
                }
                
                console.log('[onboarding] 🔍 redirectPractitioners() called');
                
                if (!window.firebaseAuth) {
                    console.log('[onboarding] ⏳ firebaseAuth not ready');
                    return;
                }
                
                if (!window.firebaseDb) {
                    console.log('[onboarding] ⏳ firebaseDb not ready');
                    return;
                }
                
                const user = window.firebaseAuth.currentUser;
                if (!user) {
                    console.log('[onboarding] ⚠️ No user logged in');
                    return;
                }
                
                console.log('[onboarding] ✅ User found - UID:', user.uid, 'Email:', user.email);
                
                try {
                    const userDoc = await window.firebaseDb.collection('users').doc(user.uid).get();
                    console.log('[onboarding] 🔍 User document exists:', userDoc.exists);
                    
                    if (userDoc.exists) {
                        const data = userDoc.data();
                        const role = String(data.role || 'user').toLowerCase().trim();
                        console.log('[onboarding] 🔍 Role from document:', role, 'Raw:', data.role);
                        
                        if (role === 'practitioner') {
                            console.log('[onboarding] ✅✅✅ PRACTITIONER DETECTED - REDIRECTING NOW');
                            window._redirectCheckDone = true;
                            window.location.replace('/practitioner-dashboard.html');
                            return;
                        }
                        if (role === 'admin') {
                            console.log('[onboarding] ✅✅✅ ADMIN DETECTED - REDIRECTING NOW');
                            window._redirectCheckDone = true;
                            window.location.replace('/admin-dashboard.html');
                            return;
                        }
                    } else {
                        console.log('[onboarding] ⚠️ User document not found, checking applications');
                        const email = user.email?.toLowerCase().trim();
                        if (email) {
                            const apps = await window.firebaseDb.collection('practitionerApplications')
                                .where('email', '==', email)
                                .where('status', '==', 'approved')
                                .limit(1)
                                .get();
                            
                            console.log('[onboarding] 🔍 Applications found:', apps.size);
                            if (!apps.empty) {
                                console.log('[onboarding] ✅✅✅ APPROVED APP FOUND - REDIRECTING');
                                window._redirectCheckDone = true;
                                window.location.replace('/practitioner-dashboard.html');
                                return;
                            }
                        }
                    }
                    // Regular user confirmed - show onboarding content
                    console.log('[onboarding] ✅ User is regular user - staying on page');
                    window._redirectCheckDone = true;
                    if (window.showOnboardingContent) {
                        console.log('[onboarding] ✅ Calling showOnboardingContent()');
                        window.showOnboardingContent();
                    }
                } catch (err) {
                    console.error('[onboarding] ❌ Error in redirectPractitioners:', err);
                    // On error, only show content if we have a user (might be regular user)
                    window._redirectCheckDone = true;
                    if (window.firebaseAuth && window.firebaseAuth.currentUser) {
                        if (window.showOnboardingContent) {
                            window.showOnboardingContent();
                        }
                    }
                }
            }
            
            // Start checking immediately
            function startChecks() {
                console.log('[onboarding] 🔄 startChecks() called');
                if (window.firebaseAuth && window.firebaseDb) {
                    console.log('[onboarding] ✅ Firebase ready - running check');
                    redirectPractitioners();
                } else {
                    console.log('[onboarding] ⏳ Waiting for Firebase...');
                    setTimeout(startChecks, 200);
                }
            }
            
            // Run immediately
            startChecks();
            
            // Also check on auth state change
            if (window.firebaseAuth) {
                console.log('[onboarding] ✅ Setting up auth state listener');
                window.firebaseAuth.onAuthStateChanged((user) => {
                    console.log('[onboarding] 🔍 Auth state changed, user:', user ? user.uid : 'null');
                    if (user) {
                        setTimeout(redirectPractitioners, 500);
                    }
                });
            } else {
                const waitForAuth = setInterval(() => {
                    if (window.firebaseAuth) {
                        clearInterval(waitForAuth);
                        window.firebaseAuth.onAuthStateChanged((user) => {
                            if (user) {
                                setTimeout(redirectPractitioners, 500);
                            }
                        });
                    }
                }, 100);
                setTimeout(() => clearInterval(waitForAuth), 5000);
            }
            
            // Single check - run once, then show content if user is regular
            const runCheckOnce = async () => {
                if (window._redirectCheckDone) return;
                
                // CRITICAL: Wait for auth state to be known before showing content
                if (!window.firebaseAuth || !window.firebaseAuth.currentUser) {
                    console.log('[onboarding] ⏳ Waiting for auth state before showing content');
                    // Set up auth listener if not already done
                    if (window.firebaseAuth && !window._bodyAuthListenerSet) {
                        window._bodyAuthListenerSet = true;
                        window.firebaseAuth.onAuthStateChanged((user) => {
                            if (user && !window._redirectCheckDone) {
                                console.log('[onboarding] 🔐 Auth state known - user detected, running check');
                                setTimeout(() => runCheckOnce(), 100);
                            }
                        });
                    }
                    return;
                }
                
                console.log('[onboarding] 🔄 Running single redirect check');
                await redirectPractitioners();
                // After check, if still on page and content not shown, show it
                // BUT ONLY if redirect check is done AND we have a user (meaning we confirmed user is NOT practitioner)
                setTimeout(() => {
                    if (window.location.pathname.includes('client-onboarding.html') && 
                        !window._onboardingContentShown && 
                        window._redirectCheckDone &&
                        window.firebaseAuth && 
                        window.firebaseAuth.currentUser) {
                        console.log('[onboarding] ✅ Check complete - showing onboarding content (user confirmed)');
                        if (window.showOnboardingContent) {
                            window.showOnboardingContent();
                        }
                    }
                }, 300);
            };
            
            // Run check once after Firebase is ready
            if (window.firebaseAuth && window.firebaseDb) {
                runCheckOnce();
            } else {
                setTimeout(runCheckOnce, 1000);
            }
        })();
        
        // Setup handlers
        document.addEventListener('DOMContentLoaded', function() {
            console.log('[onboarding] DOMContentLoaded - setting up handlers');
            setupOnboardingHandlers();
        });
        
        // Background auth check - only redirects if absolutely necessary
        async function checkAuthStatusBackground() {
            console.log('[onboarding] 🔍 checkAuthStatusBackground() called');
            try {
                if (!window.firebaseAuth) {
                    console.log('[onboarding] ⚠️ Firebase not ready - page will work without auth check');
                    return;
                }
                
                // Check if user is logged in
                const currentUser = window.firebaseAuth.currentUser;
                console.log('[onboarding] 🔍 Current user:', currentUser ? currentUser.uid : 'NOT LOGGED IN');
                
                if (!currentUser) {
                    // Not logged in - but don't redirect immediately
                    // Let them see the page, they'll be redirected when they try to submit
                    console.log('[onboarding] ⚠️ User not logged in - will redirect on form submission');
                    return;
                }
                
                // User is logged in - check role FIRST
                if (!window.firebaseDb) {
                    console.log('[onboarding] ⚠️ Firestore not ready');
                    return;
                }
                
                console.log('[onboarding] 🔍 Fetching user document for UID:', currentUser.uid);
                const userDoc = await window.firebaseDb.collection('users').doc(currentUser.uid).get();
                console.log('[onboarding] 🔍 User document exists:', userDoc.exists);
                
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    console.log('[onboarding] 🔍 User data:', JSON.stringify(userData, null, 2));
                    const role = (userData.role || 'user').toLowerCase().trim();
                    console.log('[onboarding] 🔍 Detected role:', role, 'type:', typeof role);
                    
                    // CRITICAL: Redirect practitioners and admins immediately
                    if (role === 'practitioner') {
                        console.log('[onboarding] ✅ Practitioner detected - redirecting immediately to practitioner dashboard');
                        window.location.href = '/practitioner-dashboard.html';
                        return;
                    } else if (role === 'admin') {
                        console.log('[onboarding] ✅ Admin detected - redirecting immediately to admin dashboard');
                        window.location.href = '/admin-dashboard.html';
                        return;
                    }
                    
                    // For regular users, check if they already have practitioner
                    const practitionerId = userData.practitionerId || userData.connectedPractitioner || null;
                    console.log('[onboarding] 🔍 Practitioner ID:', practitionerId);
                    
                    if (practitionerId) {
                        // Already linked - redirect to dashboard
                        console.log('[onboarding] ✅ User already has practitioner, redirecting to dashboard');
                        window.location.href = '/user-dashboard.html';
                        return;
                    }
                } else {
                    console.log('[onboarding] ⚠️ User document does not exist in Firestore');
                    // Check for approved practitioner application
                    const normalizedEmail = currentUser.email?.toLowerCase().trim();
                    if (normalizedEmail) {
                        console.log('[onboarding] 🔍 Checking for approved practitioner application with email:', normalizedEmail);
                        try {
                            const practitionerAppSnapshot = await window.firebaseDb.collection('practitionerApplications')
                                .where('email', '==', normalizedEmail)
                                .where('status', '==', 'approved')
                                .limit(1)
                                .get();
                            
                            if (!practitionerAppSnapshot.empty) {
                                console.log('[onboarding] ✅ Found approved practitioner application - redirecting to practitioner dashboard');
                                window.location.href = '/practitioner-dashboard.html';
                                return;
                            } else {
                                console.log('[onboarding] ⚠️ No approved practitioner application found');
                            }
                        } catch (appCheckError) {
                            console.warn('[onboarding] Error checking practitioner application:', appCheckError);
                        }
                    }
                }
                
                // Setup real-time listener for when practitioner gets linked
                setupPractitionerIdListener(currentUser.uid);
            } catch (error) {
                console.error('[onboarding] ❌ Error in background auth check:', error);
                console.error('[onboarding] Error stack:', error.stack);
                // Don't redirect on error
            }
        }
        
        // Set up real-time listener for practitionerId changes
        function setupPractitionerIdListener(uid) {
            if (!window.firebaseDb) return;
            
            const userRef = window.firebaseDb.collection('users').doc(uid);
            userRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const userData = doc.data();
                    const practitionerId = userData.practitionerId || userData.connectedPractitioner || null;
                    
                    // If practitioner was just linked, redirect to dashboard
                    if (practitionerId && userData.role === 'client') {
                        window.location.href = '/user-dashboard.html';
                    }
                }
            }, (error) => {
                console.error('Error setting up practitionerId listener:', error);
            });
        }
        
        // Setup onboarding handlers
        function setupOnboardingHandlers() {
            // Questionnaire handler
            const questionnaireBtn = document.getElementById('onboarding-questionnaire-submit-btn');
            const questionnaireFeedback = document.getElementById('onboarding-questionnaire-feedback');
            const questionnaireMessage = document.getElementById('onboarding-questionnaire-message');
            
            if (questionnaireBtn) {
                questionnaireBtn.addEventListener('click', async () => {
                    // Check auth before submitting
                    if (!window.firebaseAuth || !window.firebaseAuth.currentUser) {
                        questionnaireFeedback.innerHTML = '<div class="alert alert-error">Please log in first. Redirecting to login page...</div>';
                        setTimeout(() => {
                            window.location.href = '/login.html';
                        }, 2000);
                        return;
                    }
                    
                    questionnaireFeedback.innerHTML = '';
                    
                    if (!window.CTClientLinking) {
                        questionnaireFeedback.innerHTML = '<div class="alert alert-error">Client linking module not loaded</div>';
                        return;
                    }
                    
                    const needCheckboxes = document.querySelectorAll('#onboarding-questionnaire-section input[type="checkbox"][data-need-tag]');
                    const needs = Array.from(needCheckboxes)
                        .filter(cb => cb.checked)
                        .map(cb => cb.getAttribute('data-need-tag'))
                        .filter(tag => tag); // Filter out any null/empty values
                    
                    if (needs.length === 0) {
                        questionnaireFeedback.innerHTML = '<div class="alert alert-error">Please select at least one option</div>';
                        return;
                    }
                    
                    const message = questionnaireMessage ? questionnaireMessage.value.trim() : '';
                    
                    try {
                        questionnaireBtn.disabled = true;
                        questionnaireBtn.textContent = 'Sending...';
                        
                        await window.CTClientLinking.createClientRequest(needs, message);
                        
                        questionnaireFeedback.innerHTML = '<div class="alert alert-success">Request sent successfully! A practitioner will review and accept your request. You will be redirected to your dashboard once connected.</div>';
                        questionnaireBtn.disabled = false;
                        questionnaireBtn.textContent = 'Send Request';
                        
                        // Optionally redirect after a delay, or wait for practitioner to accept
                        // For now, we'll let them know to wait
                    } catch (err) {
                        questionnaireFeedback.innerHTML = `<div class="alert alert-error">${err.message || 'Could not send request. Please try again.'}</div>`;
                        questionnaireBtn.disabled = false;
                        questionnaireBtn.textContent = 'Send Request';
                    }
                });
            }
        }

        // Style 6: Compact Dropdown Menu Toggle - Clean Implementation
        (function() {
            // Ensure nav is visible on desktop immediately
            function ensureNavVisibility() {
                const desktopLogoutBtn = document.getElementById("desktopLogoutBtn");
                const menuToggle = document.getElementById("menuToggle");
                const isMobile = window.innerWidth <= 768;
                
                if (desktopLogoutBtn) {
                    if (isMobile) {
                        // Mobile: hide desktop logout button (use bottom nav instead)
                        desktopLogoutBtn.style.cssText = 'display: none !important; visibility: hidden !important; opacity: 0 !important;';
                        console.log('[onboarding] Mobile: Desktop logout button hidden');
                    } else {
                        // Desktop: show desktop logout button
                        desktopLogoutBtn.style.cssText = 'display: block !important; visibility: visible !important; opacity: 1 !important; margin-left: auto !important; margin-right: 0 !important; width: auto !important; flex-shrink: 0 !important; background: rgba(255,255,255,0.2) !important; color: #ffffff !important; border-color: rgba(255,255,255,0.3) !important;';
                        console.log('[onboarding] Desktop: Desktop logout button visible');
                    }
                }
                
                if (menuToggle) {
                    if (isMobile) {
                        // Mobile: show hamburger menu
                        menuToggle.style.cssText = 'display: flex !important; visibility: visible !important; opacity: 1 !important;';
                    } else {
                        // Desktop: hide hamburger menu
                        menuToggle.style.cssText = 'display: none !important; visibility: hidden !important; opacity: 0 !important;';
                    }
                }
            }
            
            // Run immediately and on load/resize
            ensureNavVisibility();
            window.addEventListener('load', ensureNavVisibility);
            window.addEventListener('resize', ensureNavVisibility);

            // Logout handler function - make it globally accessible
            window.handleLogout = async function handleLogout(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                
                console.log('[onboarding] Logout button clicked');
                
                // Show loading screen
                if (window.showLoadingScreen) {
                    window.showLoadingScreen('Signing out...', 'Logging out of ClearTrack');
                }
                
                try {
                    // Check if Firebase Auth is available
                    if (!window.firebaseAuth) {
                        console.error('[onboarding] Firebase Auth not available. Please ensure firebase-init.js is loaded.');
                        if (window.hideLoadingScreen) window.hideLoadingScreen();
                        return;
                    }
                    
                    console.log('[onboarding] Signing out from Firebase...');
                    
                    // Sign out from Firebase
                    await window.firebaseAuth.signOut();
                    
                    console.log('[onboarding] Firebase sign out successful');
                    
                    // Clear any local storage
                    localStorage.removeItem('token');
                    localStorage.removeItem('firebaseUser');
                    localStorage.removeItem('rememberMeEmail');
                    
                    console.log('[onboarding] Local storage cleared, redirecting...');
                    
                    // Small delay to show loading message
                    await new Promise(resolve => setTimeout(resolve, 300));
                    
                    // Redirect to index page
                    window.location.href = '/index.html';
                } catch (error) {
                    console.error('[onboarding] Logout error:', error);
                    console.error('[onboarding] Error details:', error.message, error.code);
                    if (window.hideLoadingScreen) window.hideLoadingScreen();
                    // Still redirect even if logout fails
                    window.location.href = '/index.html';
                }
            };
            
            // Logout handler for desktop logout button (already has onclick in HTML)
            // Logout handler for bottom nav button
            const bottomNavLogout = document.getElementById("bottomNavLogout");
            const bottomNav = document.getElementById("bottomNav");
            
            function updateBottomNavVisibility() {
                if (bottomNav) {
                    const isMobile = window.innerWidth <= 768;
                    console.log('[onboarding] Window width:', window.innerWidth, 'isMobile:', isMobile);
                    
                    if (isMobile) {
                        // Mobile: show bottom nav
                        bottomNav.style.cssText = 'display: flex !important; position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; z-index: 10000 !important; visibility: visible !important; opacity: 1 !important; justify-content: center !important; align-items: center !important;';
                        console.log('[onboarding] Bottom nav shown on mobile');
                    } else {
                        // Desktop: hide bottom nav
                        bottomNav.style.cssText = 'display: none !important; visibility: hidden !important; opacity: 0 !important;';
                        console.log('[onboarding] Bottom nav hidden on desktop');
                    }
                } else {
                    console.warn('[onboarding] Bottom nav element not found');
                }
            }
            
            // Function to ensure bottom nav is visible on mobile
            function ensureBottomNavVisible() {
                const nav = document.getElementById("bottomNav");
                if (nav) {
                    const isMobile = window.innerWidth <= 768 || window.matchMedia('(max-width: 768px)').matches;
                    console.log('[onboarding] Ensuring bottom nav visibility. Width:', window.innerWidth, 'isMobile:', isMobile);
                    
                    if (isMobile) {
                        nav.style.setProperty('display', 'flex', 'important');
                        nav.style.setProperty('position', 'fixed', 'important');
                        nav.style.setProperty('bottom', '0', 'important');
                        nav.style.setProperty('left', '0', 'important');
                        nav.style.setProperty('right', '0', 'important');
                        nav.style.setProperty('z-index', '10000', 'important');
                        nav.style.setProperty('visibility', 'visible', 'important');
                        nav.style.setProperty('opacity', '1', 'important');
                        nav.style.setProperty('justify-content', 'center', 'important');
                        nav.style.setProperty('align-items', 'center', 'important');
                        console.log('[onboarding] Bottom nav forced to display on mobile');
                    } else {
                        nav.style.setProperty('display', 'none', 'important');
                        nav.style.setProperty('visibility', 'hidden', 'important');
                        nav.style.setProperty('opacity', '0', 'important');
                        console.log('[onboarding] Bottom nav hidden on desktop');
                    }
                } else {
                    console.error('[onboarding] Bottom nav element NOT found');
                }
            }
            
            if (bottomNav) {
                console.log('[onboarding] Bottom nav element found');
                // Set initial visibility multiple times to ensure it works
                ensureBottomNavVisible();
                setTimeout(ensureBottomNavVisible, 50);
                setTimeout(ensureBottomNavVisible, 200);
                setTimeout(ensureBottomNavVisible, 500);
            } else {
                console.error('[onboarding] Bottom nav element NOT found in DOM');
            }
            
            if (bottomNavLogout) {
                console.log('[onboarding] Bottom nav logout button found');
                bottomNavLogout.addEventListener("click", handleLogout);
            } else {
                console.warn('[onboarding] Bottom nav logout button NOT found');
            }
            
            // Update visibility on window resize and load
            window.addEventListener('resize', ensureBottomNavVisible);
            window.addEventListener('load', ensureBottomNavVisible);
            
            // Also use matchMedia for more reliable detection
            const mediaQuery = window.matchMedia('(max-width: 768px)');
            mediaQuery.addEventListener('change', ensureBottomNavVisible);
        })();
    </script>
</body>
